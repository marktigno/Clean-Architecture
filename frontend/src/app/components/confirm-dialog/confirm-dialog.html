<div class="confirm-overlay" role="dialog" aria-modal="true" aria-labelledby="confirm-title">
  <div class="confirm-card">
    <h2 id="confirm-title">{{ title() }}</h2>
    <p>{{ message() }}</p>
    <div class="confirm-actions">
      <button type="button" (click)="cancelled.emit()" [disabled]="busy()">{{ cancelText() }}</button>
      <button type="button" class="danger" (click)="confirmed.emit()" [disabled]="busy()">
        {{ confirmText() }}
      </button>
    </div>
  </div>
</div>
